<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:transparent} svg{display:block;width:128px;height:128px}</style>
</head><body><svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.65"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="256" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded-square background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>

  <!-- abstract brain lobes (two intertwined curves forming a 'mind' silhouette) -->
  <g fill="none" stroke="url(#ring)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- left lobe -->
    <path d="M256 152
             C 192 152, 144 200, 144 256
             C 144 296, 168 332, 200 348"/>
    <!-- right lobe -->
    <path d="M256 152
             C 320 152, 368 200, 368 256
             C 368 296, 344 332, 312 348"/>
    <!-- brain stem / middle connector -->
    <path d="M200 348
             C 224 360, 240 360, 256 360
             C 272 360, 288 360, 312 348"/>
    <!-- inner detail (left) -->
    <path d="M200 248
             C 216 240, 232 240, 248 248" opacity="0.85"/>
    <!-- inner detail (right) -->
    <path d="M264 248
             C 280 240, 296 240, 312 248" opacity="0.85"/>
  </g>

  <!-- central sparkle (the "aura") -->
  <g transform="translate(256 256)">
    <path d="M0 -54 L12 -12 L54 0 L12 12 L0 54 L-12 12 L-54 0 L-12 -12 Z"
          fill="#FFFFFF" opacity="0.95"/>
    <circle r="14" fill="#A855F7"/>
    <circle r="6" fill="#FFFFFF"/>
  </g>
</svg>
</body></html>
